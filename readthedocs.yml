# readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools we might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.7"
  jobs:
    build:
      # The default Sphinx command with parallel jobs, to stay well within
      # the 15 minute build time limit. A build killed by RTD at the limit
      # leaves no log to investigate, hence the timeout: it stops a slow
      # build before the limit, so that its log is kept.
      html:
        - timeout --signal=INT --kill-after=10 810 python -u -m sphinx -T -j 4 -b html -d _build/doctrees -D language=en docs/source $READTHEDOCS_OUTPUT/html

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Build documentation with MkDocs
#mkdocs:
#  configuration: mkdocs.yml

# Optionally build your docs in additional formats such as PDF and ePub
formats: []

# Optionally set the Python requirements required to build your docs
python:
  install:
    - requirements: requirements.txt

submodules:
  include: all
